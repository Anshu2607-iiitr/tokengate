server {
    listen 80;
    root /usr/share/nginx/html;

    location /v1/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /admin/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}