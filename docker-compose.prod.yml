# PRODUCTION: sirf Caddy (80/443) internet pe khula hai. Baaki sab andar ke network me.
# Server pe chalao:  docker compose -f docker-compose.prod.yml up -d --build
# Secrets .env file se aate hain (template: .env.example). .env kabhi commit mat karna.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [dashboard]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  dashboard:
    build: ./dashboard
    restart: unless-stopped
    depends_on: [app]

  app:
    build: .
    restart: unless-stopped
    depends_on: [postgres, redis, kafka, ollama]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tokengate
      SPRING_DATASOURCE_USERNAME: tokengate
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_JPA_SHOWSQL: "false"
      SPRINGDOC_APIDOCS_ENABLED: "false"
      SPRINGDOC_SWAGGERUI_ENABLED: "false"
      TOKENGATE_ADMIN_TOKEN: ${TOKENGATE_ADMIN_TOKEN:?set TOKENGATE_ADMIN_TOKEN in .env}
      TOKENGATE_PROVIDERS_OLLAMA_BASE_URL: http://ollama:11434/v1
      TOKENGATE_PROVIDERS_MOCK_BASE_URL: http://localhost:8080/mock/openai/v1
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60"

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: tokengate
      POSTGRES_USER: tokengate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped

  kafka:
    image: apache/kafka:latest
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    depends_on: [prometheus]
    ports:
      - "127.0.0.1:3001:3000"   # sirf server ke andar se: SSH tunnel se kholna
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  ollama:
  grafana: