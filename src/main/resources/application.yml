spring:
  application:
    name: tokengate
  datasource:
    url: jdbc:postgresql://localhost:5432/tokengate
    username: tokengate
    password: tokengate
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  kafka:
    bootstrap-servers: localhost:9092
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

  
tokengate:
  admin-token: dev-admin-secret
  providers:
    ollama:
      base-url: http://localhost:11434/v1
      api-key: ollama
      models: "qwen2.5:1.5b"
    mock:
      base-url: http://localhost:8080/mock/openai/v1
      api-key: mock-key

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: tokengate
