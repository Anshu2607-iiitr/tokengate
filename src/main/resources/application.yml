spring:
  application:
    name: tokengate
  datasource:
    url: jdbc:postgresql://localhost:5432/tokengate
    username: tokengate
    password: tokengate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: localhost:9092
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

  
tokengate:
  provider:
    name: mock
    base-url: http://localhost:8080/mock/openai/v1
    api-key: mock-key